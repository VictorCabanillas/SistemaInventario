server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Por defecto nginx limita el cuerpo de una petición a 1 MB y responde
    # 413 sin ni siquiera reenviarla al backend — demasiado poco para una
    # foto de cámara de móvil (varios MB) o para subir varias de golpe.
    # El backend ya limita cada imagen a 8 MB (ver IMAGEN_MAX_UPLOAD_BYTES
    # en main.py); esto solo evita que nginx corte antes de llegar ahí.
    client_max_body_size 30M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
